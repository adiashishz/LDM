[project]
name = "ldm-downloader"  # the command and the Python module are `ldm`
version = "0.4.0"
description = "Linux download manager (v1, Python)"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Aditya Ashish" }]
dependencies = ["httpx[socks]>=0.26", "yt-dlp[default]>=2026.1", "dnspython>=2.6", "cryptography>=41",
                # the Linux desktop: D-Bus (the service, notifications, tray) and the Secret Service keyring
                "dbus-fast>=2.20; sys_platform == 'linux'", "secretstorage>=3.3; sys_platform == 'linux'",
                # Windows: the tray icon and its notifications
                "pystray>=0.19; sys_platform == 'win32'", "Pillow>=10; sys_platform == 'win32'"]

[project.urls]
Homepage = "https://github.com/adiashishz/LDM"
Issues = "https://github.com/adiashishz/LDM/issues"

[project.optional-dependencies]
dev = ["pytest>=7.4"]
gui = ["PySide6-Essentials>=6.8"]  # the window (QtCore, QtGui, QtWidgets, QtSvg); usually the distro package

[project.scripts]
ldm = "ldm.cli:main"
ldm-nmhost = "ldm.nmhost:main"  # the browser bridge (Windows browsers start a program, not a script)

[project.gui-scripts]
ldm-gui = "ldm.qt.app:main"

[tool.hatch.build.targets.wheel]
packages = ["src/ldm"]  # the project is named ldm-downloader, the package ldm

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
