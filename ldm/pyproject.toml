[project]
name = "ldm"
version = "0.1.0"
description = "Linux download manager (v1, Python)"
requires-python = ">=3.11"
dependencies = ["httpx>=0.27", "dbus-fast>=2.20"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
ldm = "ldm.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
