# Flatpak manifest for LDM. Build and install locally (from the repository root):
#   flatpak-builder --user --install --install-deps-from=flathub --force-clean \
#       build-dir ldm/packaging/io.github.adiashishz.LDM.yml
# CI builds it with Flathub's builder image and runs flatpak-builder-lint and the smoke test.
#
# Python dependencies: flatpak-python-deps.yml and flatpak-build-deps.yml, generated by
# flatpak-python-deps.py (see its header to update them).
#
# Differences from the distribution packages, handled in the code (ldm/sandbox.py):
#   - Start at login uses the Background portal (there are no systemd user units in a sandbox).
#   - Saving outside Downloads needs a folder chosen in LDM (the file chooser portal grants it).
#   - Keeping the computer awake uses the Inhibit portal; suspend/power off when done is not offered.
#   - The browser bridge is a launcher written by `ldm install-browser-integration` on the host.
app-id: io.github.adiashishz.LDM
runtime: org.gnome.Platform
runtime-version: "51"
sdk: org.gnome.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.node24
command: ldm-gui
finish-args:
  - --share=network
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  # Downloads go here by default; other folders are granted by choosing them in LDM.
  - --filesystem=xdg-download
  # Native-messaging manifests for browsers on the host (`ldm install-browser-integration`).
  - --filesystem=~/.mozilla/native-messaging-hosts:create
  - --filesystem=~/.config/google-chrome/NativeMessagingHosts:create
  - --filesystem=~/.config/chromium/NativeMessagingHosts:create
  - --filesystem=~/.config/BraveSoftware/Brave-Browser/NativeMessagingHosts:create
  - --talk-name=org.freedesktop.Notifications
  # Tray icon (StatusNotifierItem) and site logins in the keyring (Secret Service).
  - --talk-name=org.kde.StatusNotifierWatcher
  - --talk-name=org.freedesktop.secrets
  # Conditions: metered connections and battery level. (No logind: keeping the computer awake uses the
  # Inhibit portal, and "suspend / power off when done" is not offered in the Flatpak.)
  - --system-talk-name=org.freedesktop.NetworkManager
  - --system-talk-name=org.freedesktop.UPower
cleanup:
  - /include
  - /lib/pkgconfig
  - /lib/cmake
  - /share/man
  - "*.a"
  - "*.la"
modules:
  # ffmpeg and ffprobe: yt-dlp merges audio and video and fixes streams with them (copying, no encoding).
  # The runtime has the libraries but not the commands.
  - name: ffmpeg
    config-opts:
      - --disable-doc
      - --disable-debug
      - --disable-ffplay
      - --disable-autodetect
      - --enable-zlib
      - --enable-gnutls
    cleanup:
      - /share/ffmpeg
    sources:
      - type: archive
        url: https://ffmpeg.org/releases/ffmpeg-9.0.2.tar.xz
        sha256: 8c3850283eb25fa026482078a04051e0be17347b09ef81a0849bec15a96e002e

  # Boost.Python, for libtorrent's Python bindings (torrents).
  - name: boost
    buildsystem: simple
    build-commands:
      - ./bootstrap.sh --prefix=${FLATPAK_DEST} --with-libraries=python --with-python=python3
      - ./b2 -j ${FLATPAK_BUILDER_N_JOBS} install variant=release link=shared threading=multi runtime-link=shared
    sources:
      - type: archive
        url: https://archives.boost.io/release/1.90.0/source/boost_1_90_0.tar.bz2
        sha256: 49551aff3b22cbc5c5a9ed3dbc92f0e23ea50a0f7325b0d198b705e8ee3fc305

  - name: libtorrent
    buildsystem: cmake-ninja
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DCMAKE_CXX_STANDARD=17
      - -Dpython-bindings=ON
      - -Dpython-egg-info=ON
      - -Dbuild_tests=OFF
    sources:
      - type: archive
        url: https://github.com/arvidn/libtorrent/releases/download/v2.0.15/libtorrent-rasterbar-2.0.15.tar.gz
        sha256: 5e2e79129823b7ea48721164c32b5aaf83d3fd733b5502100f6705b29f27bb02

  # Node.js: yt-dlp runs YouTube's JavaScript challenges with it.
  - name: node
    buildsystem: simple
    build-commands:
      - install -Dm755 /usr/lib/sdk/node24/bin/node ${FLATPAK_DEST}/bin/node

  - flatpak-build-deps.yml
  - flatpak-python-deps.yml

  - name: ldm
    buildsystem: simple
    build-commands:
      - pip3 install --no-deps --no-build-isolation --prefix=${FLATPAK_DEST} ./ldm
      - python3 ldm/packaging/install-data.py / --prefix ${FLATPAK_DEST} --flatpak
      # The browser bridge, for the launcher `ldm install-browser-integration` writes on the host.
      - install -Dm755 ldm/src/ldm/nmhost.py ${FLATPAK_DEST}/bin/ldm-nmhost
    sources:
      - type: dir
        path: ../..
        skip:
          - .git
          - .github
          - .flatpak-builder
          - build-dir
          - repo
          - ldm.flatpak
          - ldm/.venv
          - extension
          - website
