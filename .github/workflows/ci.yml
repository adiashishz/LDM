# Run LDM's tests on each supported distribution, with that distribution's GTK, libadwaita, Python
# and Python packages. pip only fills in what the distribution lacks or ships too old, and the job lists
# those packages: they are what the distribution package has to bundle or depend on differently.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    container: ${{ matrix.image }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Fedora 44,        image: "fedora:44",     family: fedora }
          - { name: Debian 13,        image: "debian:trixie", family: debian }
          - { name: Ubuntu 24.04 LTS, image: "ubuntu:24.04",  family: debian }
          - { name: Ubuntu 26.04 LTS, image: "ubuntu:26.04",  family: debian }
          - { name: Arch Linux,       image: "archlinux:latest", family: arch }
    steps:
      - name: Install dependencies from the distribution
        run: |
          # actions/checkout needs git (and tar) inside the container.
          case ${{ matrix.family }} in
            fedora) dnf install -y git-core tar ;;
            debian) apt-get update && apt-get install -y --no-install-recommends git ca-certificates ;;
            arch)   pacman -Syu --noconfirm --needed git ;;
          esac

      - uses: actions/checkout@v4

      - name: Install LDM's dependencies
        run: sh .github/ci/install-deps.sh ${{ matrix.family }}

      - name: Set up a test user and a virtual environment on the system Python
        run: |
          useradd -m tester
          chown -R tester: .
          runuser -u tester -- python3 -m venv --system-site-packages ldm/.venv
          runuser -u tester -- ldm/.venv/bin/python -m pip install -q -e './ldm[dev]'

      - name: Versions
        run: |
          runuser -u tester -- ldm/.venv/bin/python - <<'EOF'
          import sys
          import gi
          gi.require_version("Gtk", "4.0"); gi.require_version("Adw", "1")
          from gi.repository import Adw, Gtk
          print("Python    ", sys.version.split()[0])
          print("GTK       ", ".".join(map(str, (Gtk.get_major_version(), Gtk.get_minor_version(), Gtk.get_micro_version()))))
          print("libadwaita", ".".join(map(str, (Adw.get_major_version(), Adw.get_minor_version(), Adw.get_micro_version()))))
          print("PyGObject ", gi.__version__)
          EOF
          echo "Installed by pip because the distribution's is missing or too old:"
          runuser -u tester -- ldm/.venv/bin/python -m pip list --local --exclude-editable --format=freeze | grep -v '^pip=' || echo "  (none)"

      - name: Tests
        env:
          GSK_RENDERER: cairo  # software rendering: the containers have no GL driver for Xvfb
        run: |
          cd ldm
          runuser -u tester -- xvfb-run -a .venv/bin/python -m pytest -q -rs

      - name: Install the data files and validate them
        run: |
          runuser -u tester -- ldm/.venv/bin/python ldm/packaging/install-data.py /tmp/root --libexecdir /usr/lib
          desktop-file-validate /tmp/root/usr/share/applications/io.github.adiashishz.LDM.desktop
          desktop-file-validate /tmp/root/etc/xdg/autostart/io.github.adiashishz.LDM.ClipboardWatch.desktop

  deb:
    name: .deb for ${{ matrix.name }}
    runs-on: ubuntu-latest
    container: ${{ matrix.image }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Debian 13,        image: "debian:trixie", id: debian13,    suffix: "~deb13" }
          - { name: Ubuntu 24.04 LTS, image: "ubuntu:24.04",  id: ubuntu2404,  suffix: "~ubuntu24.04" }
          - { name: Ubuntu 26.04 LTS, image: "ubuntu:26.04",  id: ubuntu2604,  suffix: "~ubuntu26.04" }
    steps:
      - name: Install the packaging tools
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            git dpkg-dev lintian curl ca-certificates

      - uses: actions/checkout@v4

      - name: Build and lint
        run: |
          git config --global --add safe.directory "$PWD"
          . /etc/os-release
          DEB_OUT=/tmp/debbuild INSTALL_BUILD_DEPS=1 DEBIAN_FRONTEND=noninteractive \
            ldm/packaging/build-deb.sh "${{ matrix.suffix }}" "$VERSION_CODENAME"
          mkdir dist && cp /tmp/debbuild/*.deb /tmp/debbuild/*.dsc /tmp/debbuild/*.tar.* dist/

      - uses: actions/upload-artifact@v4
        with:
          name: deb-${{ matrix.id }}
          path: dist/

  deb-install:
    name: Install the .deb on ${{ matrix.name }}
    needs: deb
    runs-on: ubuntu-latest
    container: ${{ matrix.image }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Debian 13,        image: "debian:trixie", id: debian13 }
          - { name: Ubuntu 24.04 LTS, image: "ubuntu:24.04",  id: ubuntu2404 }
          - { name: Ubuntu 26.04 LTS, image: "ubuntu:26.04",  id: ubuntu2604 }
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: ldm/packaging

      - uses: actions/download-artifact@v4
        with:
          name: deb-${{ matrix.id }}
          path: dist/

      - name: Install on a clean system
        # Without Recommends: no system yt-dlp, so videos rely on the bundled copy.
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends ./dist/ldm-downloader_*.deb dbus-daemon

      - name: Smoke test as a normal user
        run: |
          useradd -m tester
          runuser -u tester -- sh ldm/packaging/smoke-test.sh

  arch:
    name: Arch package (${{ matrix.variant }})
    runs-on: ubuntu-latest
    container: archlinux:latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        variant: [release, git]
    steps:
      - name: Install the packaging tools
        run: pacman -Syu --noconfirm --needed base-devel git namcap sudo

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # tags, for the -git package's version

      - name: Build and lint (as a normal user, as makepkg requires)
        run: |
          useradd -m builder
          echo "builder ALL=(ALL) NOPASSWD: ALL" > /etc/sudoers.d/builder
          chown -R builder: .
          runuser -u builder -- git config --global --add safe.directory "$PWD"
          runuser -u builder -- env ARCH_OUT=/tmp/archbuild ldm/packaging/build-arch.sh ${{ matrix.variant }}
          mkdir dist && cp /tmp/archbuild/*/*.pkg.tar.zst dist/

      - uses: actions/upload-artifact@v4
        with:
          name: arch-${{ matrix.variant }}
          path: dist/

  arch-install:
    name: Install the Arch package (${{ matrix.variant }})
    needs: arch
    runs-on: ubuntu-latest
    container: archlinux:latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        variant: [release, git]
    steps:
      - name: Install git for the checkout
        run: pacman -Syu --noconfirm --needed git

      - uses: actions/checkout@v4
        with:
          sparse-checkout: ldm/packaging

      - uses: actions/download-artifact@v4
        with:
          name: arch-${{ matrix.variant }}
          path: dist/

      - name: Install on a clean system
        run: pacman -U --noconfirm dist/*.pkg.tar.zst

      - name: Smoke test as a normal user
        run: |
          useradd -m tester
          runuser -u tester -- sh ldm/packaging/smoke-test.sh

  flatpak:
    name: Flatpak
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-51
      options: --privileged
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Install the Node.js SDK extension
        # Installed explicitly: updating the SDK that ships in the image fails on its filesystem.
        run: flatpak install -y --noninteractive --system flathub org.freedesktop.Sdk.Extension.node24//26.08

      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: ldm.flatpak
          manifest-path: ldm/packaging/io.github.adiashishz.LDM.yml
          # ffmpeg, Boost and libtorrent are rebuilt only when the manifest or the dependencies change.
          cache-key: flatpak-${{ hashFiles('ldm/packaging/io.github.adiashishz.LDM.yml', 'ldm/packaging/flatpak-*.yml') }}
          upload-artifact: true

      - name: Lint for Flathub
        # Screenshots are mirrored by Flathub's own build (and the URLs point at main), so those two
        # findings can't pass here; any other error fails the job.
        run: |
          for target in "manifest ldm/packaging/io.github.adiashishz.LDM.yml" "repo repo"; do
            flatpak-builder-lint --exceptions $target > lint.json || true
            cat lint.json
            python3 -c 'import json, sys
          known = {"appstream-missing-screenshots", "appstream-screenshots-not-mirrored-in-ostree"}
          errors = set(json.load(open("lint.json")).get("errors", [])) - known
          sys.exit(f"Flathub lint errors: {sorted(errors)}" if errors else 0)'
          done

  flatpak-install:
    name: Install the Flatpak
    needs: flatpak
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-51
      options: --privileged
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: ldm/packaging

      - uses: actions/download-artifact@v4
        with:
          pattern: "*ldm*"
          merge-multiple: true
          path: dist/

      - name: Install the bundle
        run: flatpak install -y --noninteractive --system dist/ldm.flatpak

      - name: Smoke test inside the sandbox
        # The SDK (--devel) brings dbus-run-session; the app's own files are what's tested.
        run: |
          flatpak run --devel --command=sh --filesystem="$PWD/ldm/packaging:ro" \
            io.github.adiashishz.LDM "$PWD/ldm/packaging/smoke-test.sh"
